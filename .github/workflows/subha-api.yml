name: Build and Deploy Subha API

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: Subha-Live
  NODE_VERSION: "24.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm turbo build --filter=api

      - name: Create production deployment
        run: pnpm --filter=api deploy --prod ./deploy

      - name: Replace pnpm node_modules with npm production node_modules
        working-directory: deploy
        run: |
          rm -rf node_modules

          npm install --omit=dev --no-package-lock

      - name: Inspect deployment package
        working-directory: deploy
        run: |
          echo "=== package.json ==="
          cat package.json

          echo ""
          echo "=== Production dependencies ==="
          node -e "const p=require('./package.json'); console.log(p.dependencies)"

          echo ""
          echo "=== node_modules ==="
          ls -la node_modules | head -30

          echo ""
          echo "=== dotenv installation ==="
          ls -la node_modules/dotenv

          echo ""
          echo "=== dotenv resolution ==="
          node -p "require.resolve('dotenv/config')"

          echo ""
          echo "=== express resolution ==="
          node -p "require.resolve('express')"

          echo ""
          echo "=== redis resolution ==="
          node -p "require.resolve('redis')"

          echo ""
          echo "=== supabase resolution ==="
          node -p "require.resolve('@supabase/supabase-js')"

      - name: Sanity-check production dependencies
        working-directory: deploy
        run: |
          node -e "require('dotenv/config'); console.log('DOTENV LOADED OK')"
          node -e "require('express'); console.log('EXPRESS LOADED OK')"
          node -e "require('redis'); console.log('REDIS LOADED OK')"
          node -e "require('@supabase/supabase-js'); console.log('SUPABASE LOADED OK')"

      - name: Verify production build
        working-directory: deploy
        run: |
          test -f dist/server.js
          test -f package.json
          test -d node_modules
          test -d node_modules/dotenv
          test -d node_modules/express
          test -d node_modules/redis
          test -d node_modules/@supabase/supabase-js

          echo "Production deployment package verified."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: deploy